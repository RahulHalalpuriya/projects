<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Game</title>
  <link rel="stylesheet" href="cricket.css">
</head>

<body>
  <h1> Bat Ball Stump Game</h1>

  <button class="choice_button" onclick="
 computerChoice= generatechoice();
    resultMsg=getResult('Bat', computerChoice);
  showResult('Bat',computerChoice,resultMsg);
  "><img src="/cricket/bat.png" alt = "Bat Image" class = "choice-image"></button>

  <button class="choice_button" onclick="
  computerChoice =generatechoice();
    resultMsg=getResult('Ball',computerChoice);
  showResult('Ball',computerChoice,resultMsg);
  "> <img src="/cricket/ball.png" alt = "Bat Image" class = "choice-image"></button>

  <button class="choice_button" onclick="
  computerChoice= generatechoice();
    resultMsg=getResult('Stump',computerChoice )
 showResult('Stump',computerChoice,resultMsg);
  "> <img src="/cricket/stump.png" alt = "Stump Image" class = "choice-image"></button>

  <h3 id="user_move"></h3>
  <h3 id="computer_move"></h3>
  <h3 id="result"></h3>
  <h3 id="score"></h3>

   <!-- Reset button -->
  <button onclick="localStorage.clear() 
  resetScore()"> Reset </button>

  <script>
    let scoreStr = localStorage.getItem('score');
    let score;
    resetScore(scoreStr)

    function resetScore(scoreStr) {
      score = scoreStr ? JSON.parse(scoreStr) : {
        win: 0,
        lose: 0,
        tie: 0,
      };
      score.displayScore = function () {
        return `Score :  Won : ${score.win} , Lose: ${score.lose} , tie : ${score.tie}`;
      };
      showResult();
    }



    let computerChoice;
    let resultMsg;
    // this will generate random number
    function generatechoice() {
      let randomNumber = Math.random() * 3;
      if (randomNumber > 0 && randomNumber <= 1) {
        return 'Bat';
      } else if (randomNumber > 1 && randomNumber <= 2) {
        return 'Ball';
      } else {
        return 'Stump'
      }
    }

    function getResult(userMove, computerMove) {
      if (userMove === 'Ball') {
        if (computerMove === 'Ball') {
          score.tie++;
          return `It's a tie.`;
        } else if (computerMove === 'Bat') {
          score.lose++;
          return 'Computer has won';
        } else {
          score.win++;
          return 'User won';
        }
      } else if (userMove === 'Bat') {
        if (computerMove === 'Bat') {
          score.tie++;
          return `It's a tie.`;
        } else if (computerMove === 'Ball') {
          score.win++;
          return 'User won';
        } else {
          score.lose++;
          return 'Computer has won';
        }
      } else {
        if (userMove === computerMove) {
          score.tie++;
          return `It's a tie`;

        } else if (computerMove === 'Bat') {
          score.win++;
          return 'User won';
        } else {
          score.lose++;
          return 'Computer has won';
        }
      }
    }

    function showResult(userMove, computerChoice, resultMsg) {
      localStorage.setItem('score', JSON.stringify(score));

      document.querySelector('#user_move').innerText =
        userMove ? `You have chosen ${userMove}`: '';

      document.querySelector('#computer_move').innerText=
       computerChoice  ? ` Computer choise is ${computerChoice}`:'';

      document.querySelector('#result').innerText = 
      resultMsg || '';

      document.querySelector('#score').innerText = score.displayScore();
    }
  </script>
</body>

</html>
